upstream available_servers {
    server test.mydomain.com;
    server dev.mydomain.com;
    server beta.mydomain.com;
    server stage.mydomain.com;
}

server {
    listen 80;
    server_name mydomain.com;

    location / {
        proxy_pass http://available_servers;
    }
}
server { 
    listen 80; 
    server_name test.mydomain.com; 
    root /var/www/html/test; 
    index index.html; 
}
server { 
    listen 80; 
    server_name dev.mydomain.com; 
    root /var/www/html/dev; 
    index index.html; 
}
server { 
    listen 80; 
    server_name beta.mydomain.com; 
    root /var/www/html/beta; 
    index index.html; 
}
server { 
    listen 80; 
    server_name stage.mydomain.com; 
    root /var/www/html/stage; 
    index index.html; 
}
